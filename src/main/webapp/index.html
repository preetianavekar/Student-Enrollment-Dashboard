<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Enrollment System</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container fade-in">
        <header>
            <h1>Student Portal</h1>
            <p>Welcome to the University Course Enrollment System</p>
        </header>
        
        <div class="card-grid">
            <a href="enroll" class="action-card">
                <div class="card-icon">🎓</div>
                <h2>Enroll in Courses</h2>
                <p>Register for your semester classes quickly and easily.</p>
            </a>
            
            <a href="results" class="action-card">
                <div class="card-icon">📊</div>
                <h2>View Results</h2>
                <p>Check your personalized exam scores and grades.</p>
            </a>
        </div>
    </div>
</body>
</html>
